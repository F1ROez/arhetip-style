name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_BASE_PATH: /arhetip-style
          NEXT_PUBLIC_SITE_URL: https://f1roez.github.io/arhetip-style
      - name: Build Hair City website
        run: node node_modules/next/dist/bin/next build sites/hair-city --webpack
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_BASE_PATH: /arhetip-style/hair-city
          NEXT_PUBLIC_SITE_URL: https://f1roez.github.io/arhetip-style/hair-city
      - name: Add Hair City to published pages
        run: cp -R sites/hair-city/out out/hair-city
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
